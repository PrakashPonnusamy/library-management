
server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mypracticequeries
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: library

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true